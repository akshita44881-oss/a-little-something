<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Something For You ♡</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 160, 210, 0.25), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(150, 180, 255, 0.25), transparent 30%),
        linear-gradient(135deg, #17152c, #302342, #17213d);
      color: white;
      position: relative;
    }

    /* Floating background hearts */
    .heart {
      position: absolute;
      bottom: -30px;
      font-size: 18px;
      opacity: 0.5;
      animation: floatUp linear infinite;
      pointer-events: none;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      20% {
        opacity: 0.6;
      }

      80% {
        opacity: 0.5;
      }

      to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Main card */
    .card {
      width: min(90%, 420px);
      padding: 42px 28px;
      text-align: center;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(18px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      animation: appear 1s ease;
      z-index: 2;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .bat {
      font-size: 58px;
      margin-bottom: 15px;
      animation: batFloat 3s ease-in-out infinite;
    }

    @keyframes batFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    h1 {
      font-size: 29px;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      color: #ddd6e9;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .hint {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 22px;
      font-size: 14px;
      color: #f1dff0;
    }

    .hint span {
      display: block;
      font-size: 12px;
      color: #aaa1b8;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input {
      width: 100%;
      padding: 15px 18px;
      border: none;
      outline: none;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.12);
      color: white;
      font-size: 16px;
      text-align: center;
      border: 1px solid transparent;
      transition: 0.3s;
    }

    input::placeholder {
      color: #aaa4b5;
    }

    input:focus {
      border-color: rgba(255, 180, 225, 0.7);
      background: rgba(255, 255, 255, 0.16);
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff8fcf, #b99cff);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.25s;
      box-shadow: 0 8px 25px rgba(200, 130, 220, 0.25);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(200, 130, 220, 0.4);
    }

    button:active {
      transform: scale(0.97);
    }

    .message {
      min-height: 25px;
      margin-top: 15px;
      font-size: 14px;
      color: #ffb4d8;
      transition: 0.3s;
    }

    .shake {
      animation: shake 0.4s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    /* Success screen */
    .success {
      display: none;
      position: fixed;
      inset: 0;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: #17152c;
      z-index: 10;
      text-align: center;
    }

    .success.show {
      display: flex;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .success-heart {
      font-size: 75px;
      animation: heartbeat 1.2s infinite;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.18);
      }
    }

    .success h2 {
      font-size: 34px;
      margin-top: 20px;
    }

    .success p {
      margin-top: 10px;
      color: #cfc7dc;
    }
  </style>
</head>

<body>

  <!-- Background hearts -->
  <div class="heart" style="left: 8%; animation-duration: 9s; animation-delay: 1s;">♡</div>
  <div class="heart" style="left: 20%; animation-duration: 12s; animation-delay: 3s;">♥</div>
  <div class="heart" style="left: 35%; animation-duration: 10s; animation-delay: 0s;">♡</div>
  <div class="heart" style="left: 55%; animation-duration: 13s; animation-delay: 2s;">♥</div>
  <div class="heart" style="left: 72%; animation-duration: 11s; animation-delay: 4s;">♡</div>
  <div class="heart" style="left: 88%; animation-duration: 9s; animation-delay: 1s;">♥</div>

  <!-- Main login card -->
  <div class="card" id="card">

    <div class="bat">🦇</div>

    <h1>A little secret...</h1>

    <p class="subtitle">
      Before you enter,<br>
      you gotta prove you're actually you. 👀
    </p>

    <div class="hint">
      <span>Hint</span>
      What does Batman have that flies? 🦇
    </div>

    <input
      type="password"
      id="password"
      placeholder="Enter the secret word..."
      autocomplete="off"
    >

    <button onclick="checkPassword()">
      UNLOCK ♡
    </button>

    <div class="message" id="message"></div>

  </div>

  <!-- Success screen -->
  <div class="success" id="success">

    <div class="success-heart">♡</div>

    <h2>Well well well...</h2>

    <p>Looks like you remembered. 😌</p>

  </div>


  <script>

    let attempts = 0;

    function checkPassword() {

      const input = document.getElementById("password");
      const card = document.getElementById("card");
      const message = document.getElementById("message");

      const password = input.value.trim().toLowerCase();

      if (password === "chamgadar") {

        message.innerHTML = "Okayyy... you may enter. ♡";

        setTimeout(() => {
          document.getElementById("success").classList.add("show");
        }, 700);

        return;
      }

      attempts++;

      card.classList.remove("shake");

      // Restart animation
      void card.offsetWidth;

      card.classList.add("shake");

      if (attempts === 1) {

        message.innerHTML = "Uff bhoundu 😭 try again...";

      } else if (attempts === 2) {

        message.innerHTML = "Dubara tosis kawroo 😭💀";

      } else {

        message.innerHTML =
          "😭 it's literally the Batman hint. THINK. 🦇";

      }

      input.value = "";

    }

    // Press Enter to unlock
    document.getElementById("password").addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        checkPassword();
      }

    });

  </script>

</body>
</html>
